plugins {
    id 'org.springframework.boot' version '4.0.8' apply false
}

group = 'br.com.diamante'
version = '1.0.0'

def javaVersion = providers.gradleProperty('javaVersion').getOrElse('25').toInteger()

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
        implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.3')
        implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    }
}
